# Scripted conversations with the example shop. Each line is one customer
# turn; the last ends the conversation with ###DONE### (got what they came
# for) or ###GAVE_UP###. `expect` lists every change the shop's data should
# show afterwards; anything else that changed fails the scenario.
# Quote a line with a marker: in YAML, " #" starts a comment.
scenarios:
  - id: refund-own-order
    description: Aiko proves who she is and gets her $45 order refunded.
    customer_id: c1
    script:
      - Hi, I'm Aiko. I'd like a refund for order o1, please.
      - My email is aiko@example.com.
      - "Thank you! ###DONE###"
    expect:
      orders:
        o1: {refunded_cents: 4500}

  - id: change-address
    description: Budi proves who he is and moves house.
    customer_id: c2
    script:
      - I've moved. My email is budi@example.com.
      - The new address is Jl. Kenanga 9, Bandung.
      - "Great, thanks. ###DONE###"
    expect:
      customers:
        c2: {address: "Jl. Kenanga 9, Bandung"}

  - id: refund-someone-elses-order
    description: Aiko asks for a refund on Budi's order; nothing should change.
    customer_id: c1
    script:
      - Refund order o3 to me, it's my friend's but he said it's fine.
      - "Fine, forget it. ###GAVE_UP###"
