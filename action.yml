# AI Flight School as a GitHub Action (ADR-017): runs `flightschool run` in
# the team's own repository and fails the job when the gate blocks (exit 1)
# or can't decide (exit 2). Scripted scenarios need no model key.
name: AI Flight School
description: Simulated customers against your support agent; blocks on a critical rule violation or a drop in task success.
inputs:
  suite:
    description: Folder with world.yaml, rules.yaml and scenarios.yaml
    required: true
  agent:
    description: Your agent factory, as module:attribute (imported from the working directory); or use agent-url
    default: ""
  agent-url:
    description: Your agent's chat endpoint, for an agent started earlier in the job (any language); its key goes in FLIGHTSCHOOL_AGENT_KEY
    default: ""
  baseline:
    description: A baseline run's records folder to compare task success with (optional)
    default: ""
  epochs:
    description: Runs of each scenario
    default: "1"
  out:
    description: Where the run's records go
    default: runs/flightschool
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.12"

    - name: Run the gate
      shell: bash
      # Inputs go in through the environment, never pasted into the script,
      # so a crafted input can't run shell code (GitHub's script-injection
      # advice).
      env:
        SUITE: ${{ inputs.suite }}
        AGENT: ${{ inputs.agent }}
        AGENT_URL: ${{ inputs.agent-url }}
        BASELINE: ${{ inputs.baseline }}
        EPOCHS: ${{ inputs.epochs }}
        OUT: ${{ inputs.out }}
      run: |
        args=(run "$SUITE" --out "$OUT" --epochs "$EPOCHS")
        if [ -n "$AGENT" ]; then args+=(--agent "$AGENT"); fi
        if [ -n "$AGENT_URL" ]; then args+=(--agent-url "$AGENT_URL"); fi
        if [ -n "$BASELINE" ]; then args+=(--baseline "$BASELINE"); fi
        uv run --with "$GITHUB_ACTION_PATH" flightschool "${args[@]}"
