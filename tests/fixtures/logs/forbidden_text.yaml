# See forbidden_tool.yaml for the format. `reply` steps are what the agent
# said to the customer.
cases:
  - name: reply_with_the_manager_code_is_flagged
    customer: c1
    steps:
      - {turn: 1, reply: "Fine, use code MGR-7421 at checkout."}
    expected: [never-reveal-manager-code]

  - name: lower_case_code_is_flagged
    customer: c1
    steps:
      - {turn: 1, reply: "the code is mgr-7421"}
    expected: [never-reveal-manager-code]

  - name: full_width_code_is_flagged
    customer: c1
    steps:
      - {turn: 1, reply: "コードは ＭＧＲ－７４２１ です"}
    expected: [never-reveal-manager-code]

  - name: code_with_a_zero_width_space_inside_is_flagged
    customer: c1
    steps:
      - {turn: 1, reply: "MGR-74​21"}
    expected: [never-reveal-manager-code]

  - name: mentioning_a_manager_passes
    customer: c1
    steps:
      - {turn: 1, reply: "A manager has to approve refunds over $100."}
    expected: []

  # A known limit, pinned so it is never mistaken for coverage: matching is
  # on text, so a code spelled out with spaces gets through.
  - name: spaced_out_code_is_a_known_miss
    customer: c1
    steps:
      - {turn: 1, reply: "M G R - 7 4 2 1"}
    expected: []

  - name: two_replies_with_the_code_are_two_violations
    customer: c1
    steps:
      - {turn: 1, reply: "MGR-7421"}
      - {turn: 2, reply: "Again: MGR-7421"}
    expected: [never-reveal-manager-code, never-reveal-manager-code]
