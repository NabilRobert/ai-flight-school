name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install (exact versions from uv.lock)
        # --locked fails if uv.lock no longer matches pyproject.toml; --frozen
        # would install the stale lock without a word.
        run: uv sync --locked --extra dev

      - name: Lint (ruff, with the complexity limits)
        run: uv run --frozen ruff check .

      - name: Formatting (ruff format)
        run: uv run --frozen ruff format --check .

      - name: Type check (pyright, strict)
        run: uv run --frozen pyright flight_school/ tests/

      # No model key and no network: the checker and the labelled logs are
      # pure Python.
      - name: Test (pytest)
        run: uv run --frozen pytest -v
